LogTime yes
LogClean no
LogVerbose no
PidFile /tmp/clamd.pid
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
FixStaleSocket yes
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav
Foreground yes
SelfCheck 300
FailIfCvdOlderThan 2
MaxThreads 4
MaxQueue 8
ReadTimeout 30
CommandReadTimeout 10
SendBufTimeout 30
StreamMaxLength 128M
MaxScanTime 30000
MaxScanSize 256M
MaxFileSize 128M
MaxRecursion 16
MaxFiles 1000
AlertExceedsMax yes
AlertEncrypted yes
