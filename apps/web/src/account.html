<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My account</title><style>
:root{--ink:#18323a;--surface:#fff;--background:#f4f8f7;--border:#71888d;--focus:#ac6b00;--action:#164f58}*{box-sizing:border-box}body{margin:0;font:1rem/1.5 system-ui,sans-serif;color:var(--ink);background:var(--background)}main{max-width:44rem;margin:2rem auto;padding:1.5rem}nav{display:flex;gap:1rem;flex-wrap:wrap;align-items:center}a{color:var(--action)}fieldset{min-width:0;border:1px solid var(--border);padding:1.5rem;background:var(--surface)}label{display:block;margin-top:1rem}input,button{font:inherit;min-height:2.75rem}input[type=text]{display:block;width:100%;padding:.75rem;border:1px solid var(--border);border-radius:.25rem;margin:.25rem 0}input[type=checkbox]{vertical-align:middle;width:1.25rem;min-height:1.25rem;margin-right:.5rem}button{padding:.5rem 1rem;cursor:pointer;border:1px solid var(--border);border-radius:.25rem;background:var(--surface);color:var(--ink)}button[type=submit]{background:var(--action);color:white;margin-top:1rem}button:disabled{cursor:default;opacity:.65}:focus-visible{outline:3px solid var(--focus);outline-offset:3px}#message,#verification{overflow-wrap:anywhere}#message{min-height:3rem}#reload{margin-bottom:1rem}@media(max-width:480px){main{margin:1rem auto;padding:1rem}fieldset{padding:1rem}}
</style></head><body><main>
<nav aria-label="Account navigation"><a href="/organizations">My organizations</a><a href="/learner/courses">My courses</a><a href="/author/jobs">Sign in</a><button type="button" id="sign-out">Sign out</button> <a href="/wallet">My credentials across issuers</a></nav>
<h1>My account</h1><p>Your personal profile is separate from organization memberships. Changing your display name does not change published credential records.</p>
<p id="message" role="status" aria-live="polite"></p><p id="verification"></p><button type="button" id="reload">Reload profile</button>
<form id="account-form"><fieldset id="account-fields" disabled><legend>Personal profile</legend><label for="display-name">Display name</label><input id="display-name" type="text" required maxlength="160" autocomplete="name"><label for="confirmed"><input id="confirmed" type="checkbox" required>I confirm this profile change for my signed-in account.</label><button id="save" type="submit">Save profile</button></fieldset></form>
</main><script type="module" src="/author/account.js"></script></body></html>
