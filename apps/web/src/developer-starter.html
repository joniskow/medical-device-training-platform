<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Training integration starter</title>
<style>body{margin:0;font:16px/1.5 system-ui;color:#143047;background:#f3f7f8}main{max-width:1200px;margin:auto;padding:1.5rem}nav,.row{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:.65rem;min-height:44px}button{cursor:pointer}button:disabled{cursor:wait}a{color:#075d97}section,article{background:#fff;padding:1rem;margin:1rem 0;border:1px solid #c5d2dc;border-radius:.5rem}canvas{width:100%;height:56vh;min-height:280px;display:block;touch-action:none;background:#e9eef2}canvas:focus-visible,button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #1568cc;outline-offset:3px}.workspace{display:grid;grid-template-columns:2fr 1fr;gap:1rem}.workspace>div{min-width:0}#controls{display:grid;gap:.5rem}.note{color:#425c6c}#status{min-height:2em}li{margin:.5rem 0}[hidden]{display:none!important}@media(max-width:760px){.workspace{grid-template-columns:1fr}main{padding:.75rem}canvas{height:45vh}}</style></head>
<body><main><nav><a href="/developer/api">API reference</a><a href="/signin?return=developer">Microsoft sign-in</a><button id="signout" type="button">Sign out</button></nav>
<h1>Training integration starter</h1><p class="note">A working reference for the frontend handoff. Your account determines which courses and models are available.</p>
<p id="status" role="status" aria-live="polite">Choose an organization and an enrolled course.</p>
<section id="organization"><h2>Organization</h2><div class="row"><label for="organizations">Active organization</label><select id="organizations"></select><button id="select-organization" type="button">Use organization</button><button id="refresh" type="button">Refresh courses</button></div></section>
<section id="courses"><h2>Your courses</h2><div id="course-list"></div><button id="more" type="button" hidden>More courses</button></section>
<section id="course" hidden><h2 id="course-title"></h2><div id="activities"></div></section>
<section id="activity" hidden><button id="back-to-courses" type="button">Choose another course</button><h2 id="activity-title" tabindex="-1"></h2><p id="briefing"></p><p id="progress"></p>
<div class="workspace"><div><canvas id="training-canvas" aria-label="Interactive device. Drag the background to orbit, pinch or scroll to zoom. Use the component list and controls for an equivalent keyboard path."></canvas><p id="viewer-status" role="status"></p><div class="row"><button id="reset-view" type="button">Reset view</button><button id="focus" type="button">Focus current part</button><label><input id="highlights" type="checkbox" checked> Highlight controls</label></div></div>
<div><h3 id="step-title"></h3><p id="step-instructions"></p><label for="components">Component</label><select id="components"></select><button id="select-component" type="button">Select component</button><div id="controls"></div><button id="inspect" type="button" hidden>Confirm inspection</button><button id="hint" type="button">Show next hint</button></div></div>
<p id="feedback" role="status" aria-live="polite"></p><div class="row"><button id="retry" type="button" hidden>Retry interrupted action</button><button id="resume" type="button">Resume server state</button><button id="debrief-button" type="button">View debrief</button></div></section>
<section id="debrief" hidden><h2 tabindex="-1">Activity debrief</h2><p id="debrief-summary"></p><h3>Steps</h3><ol id="debrief-steps"></ol><h3>Recorded actions</h3><ol id="debrief-events"></ol></section>
</main><script type="module" src="/developer/developer-starter.js"></script></body></html>
