<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Join an organization</title><style>body{font:16px system-ui;color:#18323a;background:#f4f8f7}main{max-width:680px;margin:40px auto;padding:24px}label{display:block;margin-top:16px}input,button{font:inherit;padding:12px;min-height:44px;box-sizing:border-box}input{width:100%}button{margin-top:16px}input[type=checkbox]{width:auto;min-height:auto}fieldset{margin:20px 0}p,dd{overflow-wrap:anywhere}a:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid #ac6b00}</style></head><body><main><nav><a href="/author/jobs">Sign in</a> | <a href="/organizations">My organizations</a> <button id="sign-out">Sign out</button></nav><h1>Join an organization</h1><p>Sign in with the verified email address that received the invitation. After signing in, reopen your invitation link.</p><p id="message" role="status" aria-live="polite"></p><form id="invitation-form"><fieldset id="details"><legend>Invitation details</legend><label for="organization">Organization ID</label><input id="organization" required maxlength="128" autocomplete="off"><label for="invitation">Invitation ID</label><input id="invitation" required maxlength="128" autocomplete="off"><label for="token">Invitation code</label><input id="token" type="password" required maxlength="43" autocomplete="off"><button type="submit">Review invitation</button></fieldset></form><section id="preview" hidden><h2>Confirm membership</h2><dl><dt>Organization</dt><dd id="organization-name"></dd><dt>Role</dt><dd id="role"></dd></dl><label><input id="confirmed" type="checkbox"> I agree to join this organization with this role.</label><button id="accept" disabled>Join organization</button></section></main><script type="module" src="/author/invitation.js"></script></body></html>
