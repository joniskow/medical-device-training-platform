<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organization invitations</title><style>body{font:16px system-ui;color:#18323a;background:#f4f8f7}main{max-width:840px;margin:40px auto;padding:24px}nav{display:flex;gap:20px;align-items:center;flex-wrap:wrap}label{display:block;margin-top:12px}input,select,textarea,button{font:inherit;padding:12px;min-height:44px;box-sizing:border-box;max-width:100%}input,textarea{width:100%}button{margin:12px 0}article{background:white;padding:20px;margin-top:20px;border:1px solid #b6c9c5}p,h2{overflow-wrap:anywhere}a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid #ac6b00}</style></head><body><main><nav><a href="/organizations" data-org-link>Choose organization</a><a href="/author/members">Members</a><a href="/author/jobs">Author workspace</a><button id="sign-out">Sign out</button></nav><h1>Organization invitations</h1><p>Invite someone using their verified email address and an organization role. Creating an invitation queues an email request. Pending means the invitation has not been accepted; it does not confirm email delivery.</p><p id="message" role="status" aria-live="polite"></p><button id="refresh">Refresh invitations</button><form id="create-form"><fieldset id="creation" disabled><legend>New invitation</legend><label for="email">Email address</label><input id="email" type="email" required maxlength="254" autocomplete="off"><label for="role">Organization role</label><select id="role" required></select><button type="submit">Create invitation</button></fieldset></form><section id="invitations" aria-label="Invitations"></section><button id="more" hidden>Load more invitations</button></main><script type="module" src="/author/invitation-admin.js"></script></body></html>
